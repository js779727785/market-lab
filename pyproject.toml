[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "market-lab"
version = "0.1.0"
description = "Auditable A-share and gold forecasting decision laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.4",
  "fastapi>=0.120",
  "httpx>=0.28",
  "lightgbm>=4.6",
  "numpy>=2.0",
  "orjson>=3.10",
  "polars>=1.35",
  "pyarrow>=20",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pytz>=2026.1",
  "python-dateutil>=2.9",
  "scikit-learn>=1.7",
  "scipy>=1.15",
  "typer>=0.20",
  "uvicorn>=0.38",
]

[project.scripts]
market-lab = "market_lab.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.14",
  "types-python-dateutil>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["market_lab"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "pyarrow.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
